<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Katherine M. Guerrerio, Johns Hopkins University. Research on interpretable multimodal reasoning.">
<link rel="icon" href="/favicon.ico">
<title>Katherine M. Guerrerio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
  :root {
    --bg: #ffffff; --side: #f4f7fb; --ink: #0f1b2d; --muted: #5a6779; --rule: #e3e9f1;
    --brand: #002d72; --accent: #2f7fd6; --chip: #e7f0fb; --ok: #0f7b5f; --ok-bg: #e3f4ee;
    --warm: #fbf6ee; --warm-ink: #8a5a14;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0c1220; --side: #111a2c; --ink: #e6ecf5; --muted: #93a1b5; --rule: #1f2b42;
      --brand: #9cc6f5; --accent: #68ace5; --chip: #16263f; --ok: #5fd0ad; --ok-bg: #0f2a24;
      --warm: #1b1810; --warm-ink: #e2b66c;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0c1220; --side: #111a2c; --ink: #e6ecf5; --muted: #93a1b5; --rule: #1f2b42;
    --brand: #9cc6f5; --accent: #68ace5; --chip: #16263f; --ok: #5fd0ad; --ok-bg: #0f2a24;
    --warm: #1b1810; --warm-ink: #e2b66c;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 clamp(15.5px, 0.45vw + 11px, 17.5px)/1.6 "Source Sans 3", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; text-underline-offset: 3px; }

  .shell { display: grid; grid-template-columns: clamp(250px, 22vw, 320px) minmax(0, 1fr); min-height: 100vh; }

  /* sidebar */
  aside { background: var(--side); border-right: 1px solid var(--rule); }
  .side-inner { position: sticky; top: 0; padding: 48px clamp(20px, 2.2vw, 36px); height: 100vh; overflow-y: auto; display: flex; flex-direction: column; }
  .avatar { width: 148px; height: 148px; border-radius: 50%; object-fit: cover; object-position: 50% 22%; border: 4px solid var(--bg); box-shadow: 0 0 0 1px var(--rule), 0 8px 24px rgba(0, 45, 114, .12); }
  aside h1 { font-size: 24px; font-weight: 700; line-height: 1.2; margin: 20px 0 4px; color: var(--brand); }
  aside .role { color: var(--muted); font-size: 14.5px; margin: 0 0 18px; }
  .social { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 28px; }
  .social a { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 10px; background: var(--bg); border: 1px solid var(--rule); color: var(--muted); transition: all .15s; }
  .social a:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; transform: translateY(-1px); }
  .toc { display: flex; flex-direction: column; gap: 2px; font-weight: 600; font-size: 14.5px; }
  .toc a { color: var(--muted); padding: 7px 12px; border-radius: 8px; border-left: 3px solid transparent; }
  .toc a:hover, .toc a.active { color: var(--brand); background: var(--chip); text-decoration: none; border-left-color: var(--accent); }
  .side-foot { margin-top: auto; font-size: 13px; color: var(--muted); display: flex; justify-content: space-between; align-items: center; }
  .theme { border: 1px solid var(--rule); background: var(--bg); color: var(--muted); border-radius: 8px; padding: 6px 10px; cursor: pointer; font: inherit; }

  /* content */
  main { width: 100%; max-width: 1120px; margin: 0 auto; padding: clamp(32px, 4vw, 64px) clamp(24px, 4.5vw, 72px) 80px; min-width: 0; }
  section { margin-bottom: 56px; scroll-margin-top: 24px; }
  h2 { font-size: 23px; font-weight: 700; margin: 0 0 18px; color: var(--brand); }
  h2 small { font-size: 14px; font-weight: 500; color: var(--muted); margin-left: 8px; }
  .lede { font-size: 17.5px; }
  .lede p { margin: 0 0 14px; }


  .umbrella { border: 1px solid var(--rule); border-left: 4px solid var(--brand); border-radius: 12px; padding: 16px 20px; background: var(--side); }
  .umbrella .k { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .umbrella h3 { margin: 2px 0 6px; font-size: 20px; font-weight: 700; color: var(--brand); }
  .umbrella p { margin: 0; }
  .bracket { position: relative; height: 24px; --c: calc((100% - 24px) / 6); }
  .bracket::before { content: ""; position: absolute; left: 50%; top: 0; height: 12px; border-left: 2px solid var(--rule); }
  .bracket::after { content: ""; position: absolute; left: var(--c); right: var(--c); top: 11px; border-top: 2px solid var(--rule); }
  .bracket span { position: absolute; top: 11px; bottom: 0; border-left: 2px solid var(--rule); }
  .bracket span:nth-child(1) { left: var(--c); } .bracket span:nth-child(2) { left: 50%; } .bracket span:nth-child(3) { right: var(--c); border-left: 0; border-right: 2px solid var(--rule); }
  .pills { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .pills > div { border: 1px solid var(--rule); border-radius: 12px; padding: 16px; }
  .pills i { color: var(--accent); font-size: 18px; }
  .pills h3 { font-size: 15.5px; margin: 10px 0 4px; font-weight: 700; }
  .pills p { margin: 0; font-size: 14.5px; color: var(--muted); line-height: 1.5; }
  .pills ul { margin: 10px 0 0; padding: 10px 0 0 16px; border-top: 1px solid var(--rule); font-size: 14px; color: var(--muted); line-height: 1.5; }
  .pills li { margin-bottom: 4px; } .pills li::marker { color: var(--accent); }

  .human { margin-top: 14px; border: 1px solid var(--rule); border-radius: 14px; padding: 20px 22px; display: grid; grid-template-columns: 44px 1fr; gap: 16px; background: var(--side); }
  .human .ic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--chip); color: var(--accent); font-size: 19px; }
  .human .k { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .human h3 { margin: 2px 0 6px; font-size: 18px; font-weight: 700; color: var(--brand); }
  .human p { margin: 0 0 10px; color: var(--ink); }
  .human .rel { display: flex; flex-wrap: wrap; gap: 8px; font-size: 14px; }
  .human .rel a { border: 1px solid var(--rule); background: var(--bg); padding: 3px 10px; border-radius: 999px; color: var(--muted); }
  .human .rel a:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }

  .news { border: 1px solid var(--rule); border-radius: 12px; max-height: 360px; overflow-y: auto; }
  .news div { display: grid; grid-template-columns: 100px 1fr; gap: 12px; padding: 8px 18px; border-bottom: 1px solid var(--rule); }
  .news div:last-child { border-bottom: 0; }
  .news time { font-weight: 700; font-size: 13.5px; color: var(--accent); font-variant-numeric: tabular-nums; padding-top: 1px; }

  /* publications with figures */
  .pub { display: grid; grid-template-columns: clamp(170px, 26%, 280px) minmax(0, 1fr); gap: 22px; padding: 20px 0; border-bottom: 1px solid var(--rule); scroll-margin-top: 24px; }
  .pub:last-child { border-bottom: 0; }
  .pub:target { background: var(--chip); border-radius: 10px; padding-left: 10px; padding-right: 10px; }
  .thumb { position: relative; align-self: start; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: #fff; aspect-ratio: 16 / 10; display: grid; place-items: center; cursor: zoom-in; }
  .thumb img { position: absolute; top: 32px; left: 8px; right: 8px; bottom: 8px; width: calc(100% - 16px); height: calc(100% - 40px); object-fit: contain; display: block; transition: transform .2s; }
  .thumb:not(.empty):hover img { transform: scale(1.03); }
  .thumb.empty { background: var(--side); cursor: default; color: var(--muted); font-size: 13px; text-align: center; }
  .thumb.empty i { display: block; font-size: 22px; margin-bottom: 6px; color: var(--accent); opacity: .6; }
  .badges { position: absolute; top: 8px; left: 8px; right: 8px; display: flex; flex-wrap: wrap; gap: 5px; z-index: 1; }
  .badge { background: var(--brand); color: var(--bg); font-weight: 700; font-size: 11.5px; padding: 2px 8px; border-radius: 5px; }
  .badge.review { background: var(--chip); color: var(--brand); border: 1px solid var(--rule); }
  .pub h3 { font-size: 17px; font-weight: 700; line-height: 1.4; margin: 0 0 4px; }
  .authors { font-size: 15px; color: var(--muted); margin: 0 0 4px; }
  .me { color: var(--ink); font-weight: 700; }
  .venue { font-size: 14.5px; font-style: italic; color: var(--muted); }
  .row { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .btn { font-size: 12.5px; font-weight: 600; border: 1px solid var(--accent); color: var(--accent); padding: 2px 10px; border-radius: 6px; }
  .btn:hover { background: var(--accent); color: var(--bg); text-decoration: none; }
  .oral { font-size: 12.5px; background: var(--ok-bg); color: var(--ok); font-weight: 600; padding: 2px 10px; border-radius: 6px; }

  .wip { display: grid; gap: 10px; }
  .wip div { border: 1px dashed var(--rule); border-radius: 10px; padding: 12px 16px; }
  .wip b { display: block; font-size: 15.5px; line-height: 1.4; }
  .wip .authors { margin: 2px 0 0; font-size: 14px; }
  h4.sub { font-size: 17px; color: var(--brand); margin: 30px 0 12px; }

  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 28px; }
  .list { list-style: none; margin: 0; padding: 0; }
  .list li { display: grid; grid-template-columns: 62px 1fr; gap: 10px; padding: 10px 0; font-size: 15px; line-height: 1.45; border-bottom: 1px solid var(--rule); }
  .list li:last-child { border: 0; }
  .list .y { font-weight: 700; color: var(--accent); font-size: 13px; padding-top: 1px; }
  .list small { display: block; color: var(--muted); font-size: 13.5px; }

  /* beyond research */
  .cr { border-radius: 14px; overflow: hidden; border: 1px solid var(--rule); background: var(--side); }
  .cr .body { padding: 18px 22px; }
  .cr .head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .cr .logo { height: 42px; width: 42px; object-fit: contain; flex: none; background: #fff; border-radius: 50%; padding: 2px; }
  .cr h3 { margin: 0; font-size: 18px; font-weight: 700; color: var(--brand); line-height: 1.2; }
  .cr h3 a { color: inherit; }
  .cr .role { color: var(--accent); font-size: 13.5px; font-weight: 600; }
  .cr p { margin: 0 0 10px; font-size: 15px; }
  .stats { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 18px; font-size: 13.5px; color: var(--muted); }
  .stats b { color: var(--brand); font-size: 15px; margin-right: 3px; }
  .more { margin-top: 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .more > div { border: 1px solid var(--rule); border-radius: 12px; padding: 16px; }
  .more .ic { width: 36px; height: 36px; border-radius: 10px; background: var(--chip); color: var(--accent); display: grid; place-items: center; font-size: 16px; margin-bottom: 10px; }
  .more h3 { margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.3; }
  .more .role { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 2px; }
  .more .when { font-size: 12.5px; color: var(--muted); }
  .more p { margin: 6px 0 0; font-size: 14px; color: var(--muted); line-height: 1.5; }

  /* lightbox */
  .lb { position: fixed; inset: 0; background: rgba(8, 14, 26, .82); display: none; place-items: center; padding: 24px; z-index: 50; cursor: zoom-out; }
  .lb.open { display: grid; }
  .lb figure { margin: 0; max-width: min(1100px, 100%); }
  .lb img { max-width: 100%; max-height: 80vh; display: block; margin: 0 auto; background: #fff; border-radius: 8px; padding: 10px; }
  .lb figcaption { color: #e6ecf5; text-align: center; margin-top: 10px; font-size: 15px; }

  @media (max-width: 1180px) {
    .pills, .more { grid-template-columns: 1fr; }
    .bracket { display: none; } .umbrella { margin-bottom: 12px; }
    .pills > div ul { columns: 2; column-gap: 28px; }
    .pills li { break-inside: avoid; }
  }
  @media (max-width: 900px) {
    .shell { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--rule); }
    .side-inner { position: static; height: auto; padding: 32px 16px 20px; align-items: center; text-align: center; }
    .avatar { width: 112px; height: 112px; }
    .social { justify-content: center; margin-bottom: 12px; }
    .toc { display: none; }
    .side-foot { margin: 0; gap: 12px; }
    main { padding: 32px 16px 56px; }
    .pills, .grid2, .cr, .more { grid-template-columns: 1fr; }
    .pills > div ul { columns: 1; }
    .bracket { display: none; } .umbrella { margin-bottom: 12px; }
    .pub { grid-template-columns: 1fr; gap: 12px; }
    .news div { grid-template-columns: 1fr; gap: 0; }
    .human { grid-template-columns: 1fr; gap: 10px; }
  }
</style>
</head>
<body>
<div class="shell">
  <aside>
    <div class="side-inner">
      <img class="avatar" id="photo" alt="Portrait of Katherine Guerrerio">
      <h1 id="name"></h1>
      <p class="role">Computer Science and Applied Math<br>Johns Hopkins University</p>
      <div class="social" id="social"></div>
      <nav class="toc" id="toc">
        <a href="#about">About</a><a href="#research">Research Interests</a><a href="#news">News</a><a href="#publications">Publications</a><a href="#honors">Awards &amp; Talks</a><a href="#beyond">Beyond Research</a>
      </nav>
      <div class="side-foot"><span id="updated"></span><button class="theme" onclick="toggleTheme()" aria-label="Toggle dark mode"><i class="fa-solid fa-moon"></i></button></div>
    </div>
  </aside>

  <main>
    <section id="about">
      <h2>About</h2>
      <div class="lede" id="bio"></div>
    </section>

    <section id="research">
      <h2>Research Interests</h2>
      <div class="umbrella" id="umbrella"></div>
      <div class="bracket" aria-hidden="true"><span></span><span></span><span></span></div>
      <div class="pills" id="pillars"></div>
      <div class="human" id="human"></div>
    </section>

    <section id="news">
      <h2>News</h2>
      <div class="news" id="newslist"></div>
    </section>

    <section id="publications">
      <h2>Publications <small>* co-first author</small></h2>
      <div id="pubs"></div>
      <h4 class="sub">Current Projects</h4>
      <div class="wip" id="progress"></div>
    </section>

    <section id="honors" class="grid2">
      <div><h2>Awards</h2><ul class="list" id="awards"></ul></div>
      <div><h2>Talks</h2><ul class="list" id="talks"></ul></div>
    </section>

    <section id="beyond">
      <h2>Beyond Research</h2>
      <div class="cr" id="cr"></div>
      <div class="more" id="more"></div>
    </section>
  </main>
</div>

<div class="lb" id="lb" onclick="this.classList.remove('open')"><figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure></div>

<script src="/assets/home/site.js"></script>
<script>
  const S = SITE;
  document.getElementById("name").textContent = S.name;
  document.getElementById("photo").src = S.photo;
  document.getElementById("updated").textContent = `Updated ${S.updated}`;
  
  render("social", S.links, l => `<a href="${l.href}" title="${l.label}" aria-label="${l.label}"><i class="${l.icon}"></i></a>`);
  render("bio", S.bio, p => `<p>${p}</p>`);
  document.getElementById("umbrella").innerHTML = `<div class="k">Core focus</div><h3>${S.umbrella.title}</h3><p>${S.umbrella.text}</p>`;
  render("pillars", S.pillars, i => `<div><i class="${i.icon}"></i><h3>${i.title}</h3><p>${i.text}</p><ul>${i.points.map(x => `<li>${x}</li>`).join("")}</ul></div>`);

  const byKey = Object.fromEntries(S.publications.map(p => [p.key, p]));
  document.getElementById("human").innerHTML = `
    <div class="ic"><i class="fa-solid fa-people-arrows"></i></div>
    <div><div class="k">Also interested in</div><h3>${S.human.title}</h3><p>${S.human.text}</p>
    </div>`;

  render("newslist", S.news, n => `<div><time>${n.date}</time><span>${n.text}</span></div>`);

  render("pubs", S.publications, p => {
    const review = p.year === "Under review";
    const tags = p.badges || [{ text: p.short + (review ? "" : " " + p.year), review }];
    const badge = `<div class="badges">${tags.map(b => `<span class="badge ${b.review ? "review" : ""}">${b.text}</span>`).join("")}</div>`;
    const thumb = p.fig
      ? `<div class="thumb" onclick="openFig('${p.fig}', '${p.key}')">${badge}<img src="/assets/home/figs/${p.fig}" alt="Main figure from ${p.title.replace(/"/g, "&quot;")}" loading="lazy"></div>`
      : `<div class="thumb empty">${badge}<span><i class="fa-regular fa-image"></i>Figure coming soon</span></div>`;
    return `<div class="pub" id="pub-${p.key}">${thumb}
      <div>
        <h3>${p.title}</h3>
        <p class="authors">${fmtAuthors(p.authors)}</p>
        <div class="venue">${p.venue}${review ? " (under review)" : ", " + p.year}</div>
        <div class="row">
          ${p.links.map(l => `<a class="btn" href="${l.href}">${l.label}</a>`).join("")}
          ${p.oral ? `<span class="oral"><i class="fa-solid fa-microphone"></i> Oral presentation</span>` : ""}
        </div>
      </div></div>`;
  });
  render("progress", S.inProgress, p => `<div><b>${p.title}</b><p class="authors">${fmtAuthors(p.authors)}</p></div>`);
  render("awards", S.awards, a => `<li><span class="y">${a.year}</span><span>${a.title}${a.text ? `<small>${a.text}</small>` : ""}</span></li>`);
  render("talks", S.talks, t => `<li><span class="y">${t.date}</span><span>${t.title}<small>${t.venue}</small></span></li>`);

  const C = S.communityReads;
  document.getElementById("cr").innerHTML = `
    <div class="body">
      <div class="head"><img class="logo" src="/assets/home/figs/cr-logo.png" alt="" onerror="this.remove()"><div><h3><a href="${C.href}">Community Reads</a></h3><div class="role">${C.role}</div></div></div>
      <p>${C.text}</p>
      <div class="stats">${C.stats.map(s => `<span><b>${s.n}</b>${s.label}</span>`).join("")}</div>
    </div>`;
  render("more", S.beyond, b => `<div><div class="ic"><i class="${b.icon}"></i></div><h3>${b.title}</h3><div class="role">${b.role}</div><div class="when">${b.when}</div><p>${b.text}</p></div>`);

  function openFig(src, key) {
    document.getElementById("lb-img").src = "/assets/home/figs/" + src;
    document.getElementById("lb-cap").textContent = byKey[key].title;
    document.getElementById("lb").classList.add("open");
  }
  addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("lb").classList.remove("open"); });

  const links = [...document.querySelectorAll("#toc a")];
  const obs = new IntersectionObserver(es => es.forEach(e => {
    if (e.isIntersecting) links.forEach(a => a.classList.toggle("active", a.getAttribute("href") === "#" + e.target.id));
  }), { rootMargin: "-30% 0px -60% 0px" });
  document.querySelectorAll("main section[id]").forEach(s => obs.observe(s));

  function toggleTheme() {
    const r = document.documentElement;
    const dark = r.dataset.theme ? r.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    r.dataset.theme = dark ? "light" : "dark";
  }
</script>
</body>
</html>
